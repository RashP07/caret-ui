<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Caret — a design system for software made by people and agents</title>
    <link rel="icon" href="/caret.svg" type="image/svg+xml" />
    <!-- Self-hosted fonts, preloaded so they're usually in before first paint (see index.css). -->
    <link rel="preload" href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/paper-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme, mode and primary color before first paint so nothing flips when the app starts.
      // Mirrors read() in src/lib/theme.tsx, including the old theme names.
      try {
        var legacy = { auto: ["neutral", "system"], vellum: ["neutral", "light"], graphite: ["neutral", "dark"], cyanotype: ["slate", "dark"], riso: ["slate", "light"], dusk: ["sand", "dark"] };
        var t = localStorage.getItem("caret-theme") || "neutral";
        var m = localStorage.getItem("caret-mode");
        if (legacy[t]) { m = m || legacy[t][1]; t = legacy[t][0]; }
        var customCss = localStorage.getItem("caret-custom-css");
        if (t === "custom" && customCss) {
          var st = document.createElement("style");
          st.id = "caret-custom-theme";
          st.textContent = customCss;
          document.head.appendChild(st);
        } else if (["neutral", "zinc", "stone", "slate", "indigo", "teal", "sand", "contrast"].indexOf(t) < 0) t = "neutral";
        document.documentElement.setAttribute("data-theme", t);
        if (m === "light" || m === "dark") document.documentElement.setAttribute("data-mode", m);
        var a = localStorage.getItem("caret-accent");
        if (a && a !== "default") document.documentElement.setAttribute("data-accent", a);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
