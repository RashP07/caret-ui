<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Caret — beautiful components with accessibility and motion built in</title>
    <meta name="description" content="Beautiful React components with accessibility and motion built in. 41 components on Base UI, eight themes in light and dark, a keyboard path for every control. Open source." />
    <link rel="icon" href="/caret.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://caretui.rashmitaparmanik.com/" />
    <!-- Link previews. Crawlers don't run the app, so these are the only tags they see, on every page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Caret" />
    <meta property="og:title" content="Caret — beautiful components, accessibility and motion built in" />
    <meta property="og:description" content="Beautiful React components with accessibility and motion built in. 41 components on Base UI, eight themes in light and dark, a keyboard path for every control. Open source." />
    <meta property="og:url" content="https://caretui.rashmitaparmanik.com/" />
    <meta property="og:image" content="https://caretui.rashmitaparmanik.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Caret: beautiful components, with accessibility and motion built in. A wall of components: buttons, switches, a select, a slider, tabs, progress bars, an invoice and more." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Caret — beautiful components, accessibility and motion built in" />
    <meta name="twitter:description" content="Beautiful React components with accessibility and motion built in. 41 components on Base UI, eight themes in light and dark, a keyboard path for every control. Open source." />
    <meta name="twitter:image" content="https://caretui.rashmitaparmanik.com/og.png" />
    <!-- Self-hosted fonts, preloaded so they're usually in before first paint (see index.css). -->
    <link rel="preload" href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/paper-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme, mode and primary color before first paint so nothing flips when the app starts.
      // Mirrors read() in src/lib/theme.tsx, including the old theme names.
      try {
        var legacy = { auto: ["neutral", "system"], vellum: ["neutral", "light"], graphite: ["neutral", "dark"], cyanotype: ["slate", "dark"], riso: ["slate", "light"], dusk: ["sand", "dark"] };
        var t = localStorage.getItem("caret-theme") || "neutral";
        var m = localStorage.getItem("caret-mode");
        if (legacy[t]) { m = m || legacy[t][1]; t = legacy[t][0]; }
        var customCss = localStorage.getItem("caret-custom-css");
        if (t === "custom" && customCss) {
          var st = document.createElement("style");
          st.id = "caret-custom-theme";
          st.textContent = customCss;
          document.head.appendChild(st);
        } else if (["neutral", "zinc", "stone", "slate", "indigo", "teal", "sand", "contrast"].indexOf(t) < 0) t = "neutral";
        document.documentElement.setAttribute("data-theme", t);
        if (m === "light" || m === "dark") document.documentElement.setAttribute("data-mode", m);
        var a = localStorage.getItem("caret-accent");
        if (a && a !== "default") document.documentElement.setAttribute("data-accent", a);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
